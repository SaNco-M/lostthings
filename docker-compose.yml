services:
  # ==============================================================================
  # 1. БАЗА ДАННЫХ
  # ==============================================================================
  postgresSQL:
    image: postgres:15-alpine
    container_name: lostthings-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-lostthings_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  # ==============================================================================
  # 2. ОДНОРАЗОВЫЙ СЕРВИС МИГРАЦИЙ
  # ==============================================================================
  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lostthings-migration
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    command: alembic upgrade head
    networks:
      - backend-net
    depends_on:
      postgresSQL:
        condition: service_healthy
    restart: "no"

  # ==============================================================================
  # 3. БЭКЕНД ПРИЛОЖЕНИЯ
  # ==============================================================================
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lostthings-backend
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    networks:
      - backend-net
      - frontend-net
    depends_on:
      migration:
        condition: service_completed_successfully
      postgresSQL:
        condition: service_healthy
    restart: always

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==============================================================================
  # 4. ОБРАТНЫЙ ПРОКСИ И СТАТИКА
  # ==============================================================================
  nginx:
    image: nginx:alpine
    container_name: lostthings-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - frontend-net
    depends_on:
      web:
        condition: service_healthy
    restart: always

# ==============================================================================
# ХРАНИЛИЩА И СЕТИ
# ==============================================================================
volumes:
  postgres_data:

networks:
  backend-net:
    internal: true

  frontend-net:
