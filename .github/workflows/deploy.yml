name: deploy to minipc

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: 'Тег (SHA) для отката'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sanco-m/lostthings

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: |
          pip install pytest pytest-asyncio httpx -r backend/requirements.txt
          pytest backend/tests/

  build-scan-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Scan
        run: |
          docker build -t app:test ./backend

      - name: Trivy Scan (Fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app:test'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Push to Registry
        run: |
          IMAGE_ID="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker tag app:test $IMAGE_ID:${{ github.sha }}
          docker tag app:test $IMAGE_ID:latest
          docker push $IMAGE_ID:${{ github.sha }}
          docker push $IMAGE_ID:latest

  deploy:
    needs: [test, build-scan-push]
    if: |
      always() &&
      (
        (
          github.event_name == 'push' &&
          needs.test.result == 'success' &&
          needs.build-scan-push.result == 'success'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.rollback_tag != ''
        )
      )
    runs-on: self-hosted
    permissions:
      packages: read
      contents: read
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      DATABASE_URL: postgresql+asyncpg://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgresSQL:5432/${{ secrets.POSTGRES_DB }}
      APP_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_tag || github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Containers
        run: |
          export APP_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$APP_TAG"
          docker compose pull
          docker compose up -d --no-build

      - name: Smoke Test (curl)
        run: |
          sleep 5
          curl -k -f https://localhost/api/ads || exit 1